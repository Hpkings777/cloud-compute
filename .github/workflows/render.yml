name: Render Ohm's Law Animation

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID'
        required: false
        default: 'OhmsLaw'
        type: choice
        options:
          - 'OhmsLaw'
          - 'DefaultExe'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: |
          COMP_ID="${{ github.event.inputs.composition }}"
          if [ -z "$COMP_ID" ]; then
            COMP_ID="OhmsLaw"
          fi
          npx remotion render src/index.ts "$COMP_ID" Outputs/output.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohms-law-video
          path: Outputs/output.mp4

      - name: Download video to repo
        uses: actions/download-artifact@v4
        with:
          name: ohms-law-video
          path: .

      - name: Commit video
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output.mp4
          git commit -m "Add rendered Ohm's Law animation" || echo "No changes to commit"
          git push