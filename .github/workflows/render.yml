name: Render Ohm's Law Animation

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render src/index.ts OhmsLaw Outputs/output.mp4 --overwrite

      - name: Upload video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ohms-law-video
          path: Outputs/output.mp4

      - name: Download video to repo
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: ohms-law-video
          path: .

      - name: Commit video
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output.mp4 || echo "No video to add"
          git commit -m "Add rendered Ohm's Law animation" || echo "No changes to commit"
          git push || echo "Push failed but continuing"